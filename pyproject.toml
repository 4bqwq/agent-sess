[project]
name = "sess-cli"
version = "0.1.0"
description = "Manage local Codex CLI and Claude Code sessions from one terminal UI."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["codex", "claude-code", "session", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
sess = "sess.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sess"]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3"]
